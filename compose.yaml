services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      DATABASE_PATH: /data/texnaz.sqlite3
    volumes:
      - texnaz_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  texnaz_data:
